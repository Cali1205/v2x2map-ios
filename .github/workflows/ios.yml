name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: Build signed and upload to TestFlight
        type: boolean
        default: true
      carplay:
        description: Sign with the CarPlay entitlement (only after Apple granted it!)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build & unit tests (Simulator, unsigned)
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -project V2X2.xcodeproj -scheme V2X2 -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E "error:|failed" build.log; tail -60 build.log; exit 1; }
          grep -E "warning: .*/V2X2/|Test Case .*(passed|failed)" build.log || true

  # Secrets are only available here: manual runs by repo writers, never fork PRs.
  testflight:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Forks: set the repository variable BUNDLE_ID to your own App ID.
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'io.github.cali1205.v2x2map' }}
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_ID" -a -n "$ASC_ISSUER_ID" -a -n "$TEAM_ID" -a -n "$ASC_KEY_P8" \
            || { echo "::error::Missing secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID (see README)"; exit 1; }
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          plutil -replace teamID -string "$TEAM_ID" ExportOptions.plist
      # Logs are public: raw xcodebuild output is kept in files and only shown redacted.
      - name: Archive
        run: |
          ENT=V2X2/V2X2.entitlements
          if [ "${{ inputs.carplay }}" = "true" ]; then ENT=V2X2/CarPlay.entitlements; fi
          xcodebuild archive -project V2X2.xcodeproj -scheme V2X2 -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/V2X2.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_ENTITLEMENTS="$ENT" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { sh scripts/redact.sh < "$RUNNER_TEMP/archive.log" | grep -E "error:|ARCHIVE FAILED" | tail -40; exit 1; }
          echo "Archive succeeded"
      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/V2X2.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1 \
            || { sh scripts/redact.sh < "$RUNNER_TEMP/export.log" | grep -iE "error|fail" | tail -40; exit 1; }
          echo "Uploaded to App Store Connect / TestFlight"
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
