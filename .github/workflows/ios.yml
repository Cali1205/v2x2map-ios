name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: Build signed and upload to TestFlight
        type: boolean
        default: true
      carplay:
        description: Sign with the CarPlay Driving Task entitlement (only after Apple granted it!)
        type: boolean
        default: false
      runner:
        description: macOS runner (try another one if the job is never picked up)
        type: choice
        options: [macos-latest, macos-15-intel, macos-26]
        default: macos-latest

permissions:
  contents: read

jobs:
  # One job so a signed build only waits once for a (scarce) macOS runner.
  # Signing steps run only on manual runs by repo writers; fork PRs never get secrets.
  build:
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner || 'macos-latest' }}
    env:
      SIGN: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Forks: set the repository variable BUNDLE_ID to your own App ID.
      BUNDLE_ID: ${{ vars.BUNDLE_ID || 'io.github.cali1205.v2x2map' }}
    steps:
      - uses: actions/checkout@v5
      # App Store Connect only accepts builds made with the iOS 26 SDK (Xcode 26+).
      - name: Select Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XC" || { echo "::error::No Xcode 26 on this runner, pick another one"; ls -d /Applications/Xcode*; exit 1; }
          sudo xcode-select -s "$XC" && xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build & unit tests (Simulator, unsigned)
        run: |
          UDID=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -project V2X2.xcodeproj -scheme V2X2 -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1 \
            || { grep -E "error:|failed" build.log; tail -60 build.log; exit 1; }
          grep -E "warning: .*/V2X2/|Test Case .*(passed|failed)" build.log || true

      - name: App Store Connect API key
        if: env.SIGN == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          test -n "$ASC_KEY_ID" -a -n "$ASC_ISSUER_ID" -a -n "$TEAM_ID" -a -n "$ASC_KEY_P8" \
            || { echo "::error::Missing secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID (see README)"; exit 1; }
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          plutil -replace teamID -string "$TEAM_ID" ExportOptions.plist
      # Logs are public: raw xcodebuild output is kept in files and only shown redacted.
      # The archive is built unsigned and then only ad-hoc signed ("-") so the entitlements get
      # embedded without a development profile (which would need a registered device). The export step below
      # re-signs it for App Store distribution with Apple's cloud-managed certificate.
      - name: Archive
        if: env.SIGN == 'true'
        run: |
          ENT=V2X2/V2X2.entitlements
          if [ "${{ inputs.carplay }}" = "true" ]; then ENT=V2X2/CarPlay.entitlements; fi
          xcodebuild archive -project V2X2.xcodeproj -scheme V2X2 -configuration Release \
            -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/V2X2.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_ENTITLEMENTS="$ENT" \
            CODE_SIGNING_ALLOWED=NO \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { sh scripts/redact.sh < "$RUNNER_TEMP/archive.log" | grep -E "error:|ARCHIVE FAILED" | tail -40; exit 1; }
          # Xcode refuses ad-hoc signing for iOS SDKs, plain codesign does not.
          APP="$RUNNER_TEMP/V2X2.xcarchive/Products/Applications/V2X2.app"
          codesign --force --sign - --entitlements "$ENT" --generate-entitlement-der "$APP"
          echo "Archive succeeded. Embedded entitlements:"
          codesign -d --entitlements - --xml "$APP" 2>/dev/null | plutil -p - || true
      - name: Upload to TestFlight
        if: env.SIGN == 'true'
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/V2X2.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1 \
            || { sh scripts/redact.sh < "$RUNNER_TEMP/export.log" | grep -iE "error|fail" | tail -40; exit 1; }
          echo "Uploaded to App Store Connect / TestFlight"
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
