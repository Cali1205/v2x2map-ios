name: V2X2
options:
  bundleIdPrefix: io.github.cali1205
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  V2X2:
    type: application
    platform: iOS
    sources: [V2X2]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.cali1205.v2x2map
        PRODUCT_NAME: V2X2
        # iPhone only; XcodeGen's target preset would otherwise override this with "1,2".
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # CI swaps in V2X2/CarPlay.entitlements once Apple has granted the CarPlay entitlement.
        CODE_SIGN_ENTITLEMENTS: V2X2/V2X2.entitlements
    info:
      path: V2X2/Info.plist
      properties:
        CFBundleDisplayName: V2X Map
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBluetoothAlwaysUsageDescription: Verbindet sich per Bluetooth mit dem ITS-G5-Empfänger (ESP32-C5).
        NSLocationWhenInUseUsageDescription: Zeigt deine Position, Fahrspur und die Entfernung zu Fahrzeugen und Ampeln.
        NSLocalNetworkUsageDescription: Sendet empfangene Frames an deinen MQTT-Broker im lokalen Netz.
        UIBackgroundModes: [bluetooth-central, location]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate

  V2X2Tests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: V2X2

schemes:
  V2X2:
    build:
      targets:
        V2X2: all
        V2X2Tests: [test]
    test:
      targets: [V2X2Tests]
